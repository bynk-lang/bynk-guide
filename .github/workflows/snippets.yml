# Compile-test and format-check every Bynk listing presented as a complete
# program (working principle 7). `bynkc check` over each project under
# snippets/ must match its expected outcome in snippets/EXPECTATIONS.tsv: a
# clean pass, the exact refusal a chapter quotes, or a specific warning. The
# chapters typeset these files verbatim, so a second gate holds them to
# canonical formatting, and a third builds each one and type-checks the emitted
# TypeScript. What the chapters quote from running them (test runs, HTTP
# responses, and generated files) is diffed against snippets/TRANSCRIPTS.tsv.
#
# ci.yml calls this at the pinned release on every push and pull request.
# bynk-canary.yml calls it at each new Bynk release, so a release that renames
# a diagnostic a chapter quotes, or changes the formatter, opens a `canary`
# issue.
name: Snippets

on:
  workflow_call:
    inputs:
      version:
        description: Bynk version to check against, exact or "latest" (empty for the pinned release)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Bynk version to check against, exact or "latest" (empty for the pinned release)
        type: string
        default: ""

permissions:
  contents: read

env:
  # The published compiler the manuscript's diagnostics are written against.
  # Chapters quote exact diagnostic codes, so this pin is part of the book's
  # evidence: bump it deliberately, with the snippet gate green, when the
  # manuscript is revised for a newer release. metadata.typ's bynk-version
  # must change with it: the book prints that release, and ci.yml checks the
  # two agree.
  BYNK_VERSION: ${{ inputs.version || '0.403.3' }}

jobs:
  snippets:
    name: Snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        # `bynk dev` starts wrangler, which needs Node 22 or later; the
        # runner's default is older.
        with:
          node-version: 22
      - uses: bynk-lang/setup-bynk@5764a6e9a326badfc9eb47086b8837aace7a5c2a # v1.0.3
        id: bynk
        with:
          version: ${{ env.BYNK_VERSION }}
      - name: Compile-test the manuscript's Bynk snippets
        run: ./scripts/check-book-snippets.sh
        env:
          BYNKC: ${{ steps.bynk.outputs.bindir }}/bynkc
      - name: Format-check the manuscript's Bynk snippets
        # Runs even when the compile gate failed: the two report different
        # defects, and a book edit that breaks both should surface both in one
        # run rather than one round trip each. Skipped when the toolchain never
        # installed, which would only add a confusing "bynkc not found". A
        # formatter change in a newer release is drift too: the chapters
        # typeset these files verbatim.
        if: ${{ !cancelled() && steps.bynk.conclusion == 'success' }}
        run: ./scripts/check-book-format.sh
        env:
          BYNKC: ${{ steps.bynk.outputs.bindir }}/bynkc
      - name: Build and type-check the manuscript's Bynk snippets
        # `bynkc check` accepting a program does not mean it builds. This
        # compiles each project for bundle and workers and runs the emitted
        # code through `tsc --strict`. Known failures are baselined in
        # snippets/EMIT-BASELINE. Runs after a compile-gate failure for the same
        # reason the format gate does.
        if: ${{ !cancelled() && steps.bynk.conclusion == 'success' }}
        run: ./scripts/check-book-emit.sh
        env:
          BYNKC: ${{ steps.bynk.outputs.bindir }}/bynkc
          TSC: npx --yes --package typescript@5.9.3 tsc
      - name: Run the manuscript's snippet tests
        # `bynkc check` type-checks tests/ but nothing else runs them. This
        # runs every tested project's suite and diffs each quoted run listed in
        # snippets/TRANSCRIPTS.tsv. `bynkc test` finds tsc on PATH, so it gets
        # the same pinned TypeScript the emit gate uses.
        if: ${{ !cancelled() && steps.bynk.conclusion == 'success' }}
        run: |
          npm install --global --no-fund --no-audit typescript@5.9.3
          ./scripts/check-book-tests.sh
        env:
          BYNKC: ${{ steps.bynk.outputs.bindir }}/bynkc
      - name: Replay the manuscript's quoted responses
        # Serves each project an HTTP transcript in snippets/TRANSCRIPTS.tsv
        # quotes with `bynk dev`, replays the requests and compares status and
        # body. The bodies are generated code, so a release can change them.
        if: ${{ !cancelled() && steps.bynk.conclusion == 'success' }}
        run: ./scripts/check-book-responses.sh
        env:
          BYNK: ${{ steps.bynk.outputs.bindir }}/bynk
      - name: Diff the manuscript's quoted compiler output
        # Compiles each project an `emit` row in snippets/TRANSCRIPTS.tsv names,
        # for the row's target, and diffs the generated file (or the lines the
        # row selects) against the chapter's copy. A code-generator change in a
        # newer release would otherwise leave the page quoting stale output.
        if: ${{ !cancelled() && steps.bynk.conclusion == 'success' }}
        run: ./scripts/check-book-emitted.sh
        env:
          BYNKC: ${{ steps.bynk.outputs.bindir }}/bynkc
      - name: Diff the manuscript's quoted deploy plans
        # Runs `bynk deploy --dry-run` (no Cloudflare calls, no token) for each
        # project a `plan` row in snippets/TRANSCRIPTS.tsv names, and diffs the
        # plan against the chapter's copy.
        if: ${{ !cancelled() && steps.bynk.conclusion == 'success' }}
        run: ./scripts/check-book-plans.sh
        env:
          BYNK: ${{ steps.bynk.outputs.bindir }}/bynk
      - name: Report the drift
        if: ${{ failure() && inputs.version != '' }}
        env:
          INSTALLED: ${{ steps.bynk.outputs.version }}
        run: |
          {
            echo "### The manuscript's evidence no longer matches Bynk ${INSTALLED#v}"
            echo
            echo "A diagnostic changed, or the formatter, a test run, a quoted"
            echo "response or quoted compiler output did. Revise the affected"
            echo "chapter and snippet, then bump"
            echo "the pin (\`BYNK_VERSION\` in \`.github/workflows/snippets.yml\`)"
            echo "to this release."
          } >> "$GITHUB_STEP_SUMMARY"
