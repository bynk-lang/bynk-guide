# Bynk canary: re-check the manuscript's evidence against a new Bynk release,
# and keep a `canary` issue open while it no longer holds.
#
# Triggered by the org dispatcher in bynk-lang/.github (on each Bynk release,
# and weekly). This repository is listed in bynk-lang/.github's
# canary/repos.json (kind `book`), and the canary GitHub App is installed on it.
# See https://github.com/bynk-lang/.github/blob/main/canary/README.md
#
# `snippets` runs both gates (snippets.yml) at the dispatched version. Its
# result is passed to canary.yml as `upstream-result`; canary.yml runs no
# checks of its own here (`ci: false`), but resolves the version, records it,
# and opens, updates or closes the one `canary` issue.
name: Bynk canary

on:
  repository_dispatch:
    types: [bynk-canary]
  workflow_dispatch:
    inputs:
      version:
        description: Bynk version, exact ("0.313.0") or "latest"
        type: string
        default: latest

permissions:
  contents: read
  issues: write
  id-token: write   # canary.yml reports with the run's GitHub OIDC token

jobs:
  snippets:
    name: Snippets
    uses: ./.github/workflows/snippets.yml
    with:
      version: ${{ github.event.client_payload.version || inputs.version || 'latest' }}

  canary:
    name: Canary
    needs: snippets
    if: ${{ !cancelled() }}
    uses: bynk-lang/.github/.github/workflows/canary.yml@v1
    with:
      version: ${{ github.event.client_payload.version || inputs.version || 'latest' }}
      upstream-result: ${{ needs.snippets.result }}
      kind: book
      ci: false
